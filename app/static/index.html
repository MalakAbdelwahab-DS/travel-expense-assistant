<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Travel Expense Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 0 16px;
        }

        #mode {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .real {
            background: #d1f7d6;
            color: #0a6b1e;
        }

        .offline {
            background: #ffe8b3;
            color: #8a5700;
        }

        #question {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 15px;
            cursor: pointer;
        }

        #answer {
            margin-top: 20px;
            padding: 14px;
            background: #f4f4f4;
            border-radius: 8px;
            min-height: 20px;
            line-height: 1.5;
        }

        #answer p {
            margin: 0 0 10px;
        }

        #answer p:last-child {
            margin-bottom: 0;
        }

        #answer h1,
        #answer h2,
        #answer h3 {
            margin: 14px 0 8px;
        }

        #answer ul,
        #answer ol {
            margin: 0 0 10px;
            padding-left: 22px;
        }

        #answer code {
            background: #e6e6e6;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        #answer pre {
            background: #272822;
            color: #f8f8f2;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
        }

        #answer pre code {
            background: none;
            padding: 0;
        }

        #answer blockquote {
            margin: 0 0 10px;
            padding-left: 12px;
            border-left: 3px solid #ccc;
            color: #555;
        }

        #answer table {
            border-collapse: collapse;
            margin-bottom: 10px;
        }

        #answer th,
        #answer td {
            border: 1px solid #ccc;
            padding: 4px 8px;
        }
    </style>
</head>

<body>
    <h2>Travel Expense Assistant</h2>
    <span id="mode">checking mode…</span>

    <div>
        <input id="question" type="text" placeholder="Ask a question about the travel expense policy...">
        <button onclick="ask()">Ask</button>
    </div>

    <div id="answer"></div>

    <script>
        async function loadStatus() {
            const res = await fetch('/status');
            const data = await res.json();
            const el = document.getElementById('mode');
            const isReal = data.mode === 'ai_agent';
            el.textContent = isReal ? '● Real Agent' : '● Offline CSV Retrieval';
            el.className = isReal ? 'real' : 'offline';
        }

        function renderMarkdown(text) {
            const answerEl = document.getElementById('answer');
            if (window.marked) {
                answerEl.innerHTML = marked.parse(text);
            } else {
                answerEl.textContent = text;
            }
        }

        async function ask() {
            const question = document.getElementById('question').value;
            const answerEl = document.getElementById('answer');
            if (!question.trim()) return;
            answerEl.textContent = 'Thinking...';

            const res = await fetch('/ask-agent?question=' + encodeURIComponent(question), {
                method: 'POST'
            });
            const data = await res.json();

            let text;
            if (Array.isArray(data)) {
                text = data.map(b => b.text).join('\n');
            } else if (data && typeof data.response === 'string') {
                text = data.response;
            } else {
                text = '```json\n' + JSON.stringify(data, null, 2) + '\n```';
            }
            renderMarkdown(text);
            loadStatus();
        }
    </script>
</body>

</html>
